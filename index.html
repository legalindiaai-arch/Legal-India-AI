<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal India AI</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--line:#ddd;--soft:#f3f3f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#161616;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px}h2{font-size:24px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:var(--fg)}a{color:var(--fg)}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:600;width:100%}.btn.o{background:transparent;color:var(--fg)}.btn.s{width:auto;display:inline-block;margin:4px 6px 4px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:5px 0 12px}
input[type=radio],input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{font-size:13px;color:var(--mut)}label.opt{display:block;padding:5px 0;color:var(--fg);font-size:15px}
.mut{color:var(--mut);font-size:13px}.link{text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
#auth{max-width:440px;margin:auto;padding:24px 20px}.brand{text-align:center;margin-bottom:14px}
.lgi{border-radius:50%;background:#fff;object-fit:contain}.brand .lgi{width:110px;height:110px}header .lgi{width:34px;height:34px}
.lang{width:auto;margin:0;padding:7px;font-size:13px}
.tabs{display:flex;border:1px solid var(--fg);border-radius:8px;overflow:hidden;margin:12px 0}.tabs button{flex:1;padding:10px 4px;border:0;background:var(--bg);cursor:pointer;font-weight:600;font-size:14px}.tabs button.on{background:var(--fg);color:var(--bg)}
.note{border:1px dashed var(--fg);padding:10px;border-radius:8px;font-size:13px;margin:10px 0}
#app{display:none;height:100vh;height:100dvh;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}header .t{font-family:Georgia,serif;font-weight:700;flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.ic{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:16px}
#pbtn{width:42px;height:42px;padding:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}#pbtn svg{width:26px;height:26px}
#drawer{position:fixed;inset:0 auto 0 0;width:270px;max-width:82%;background:var(--bg);border-right:1px solid var(--fg);transform:translateX(-100%);transition:.2s;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;overflow-y:auto}#drawer.open{transform:none}
#ov{position:fixed;inset:0;background:#0006;display:none;z-index:15}#ov.open{display:block}
#drawer a{display:block;padding:10px;border-radius:8px;cursor:pointer;text-decoration:none}#drawer a:hover,#drawer a.on{background:var(--soft)}#drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#pm{position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top,0px));background:var(--bg);border:1px solid var(--fg);border-radius:10px;padding:14px;width:230px;display:none;z-index:10}
main{flex:1;overflow-y:auto;padding:18px;max-width:860px;width:100%;margin:auto}
.disc{font-size:11.5px;color:var(--mut);padding:6px 12px;text-align:center;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.feat{cursor:pointer}.feat:hover{border-color:var(--fg)}.card p{margin:4px 0;font-size:14.5px}
.tag{display:inline-block;border:1px solid var(--fg);border-radius:20px;padding:1px 10px;font-size:11px;margin-right:6px}.tag.api{border-style:dashed}
.big{padding:22px;text-align:center}.row{display:flex;gap:8px}.row input{margin:0}.row .btn{width:auto;padding:0 18px}
#msgs{display:flex;flex-direction:column;gap:10px;min-height:240px}.m{max-width:88%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap}.u{align-self:flex-end;background:var(--fg);color:var(--bg)}.b{align-self:flex-start;background:var(--soft)}
pre{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;font-family:inherit}details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}
ul{padding-left:20px}li{margin:4px 0}
</style>
</head>

var ACTS=[["Constitution of India, 1950","Supreme law: fundamental rights and structure of government."],["Bharatiya Nyaya Sanhita, 2023","Criminal offences and punishments (replaced the IPC)."],["Bharatiya Nagarik Suraksha Sanhita, 2023","Criminal procedure: FIR, arrest, bail, trial (replaced the CrPC)."],["Bharatiya Sakshya Adhiniyam, 2023","Law of evidence (replaced the Indian Evidence Act)."],["Code of Civil Procedure, 1908","Procedure in civil courts."],["Indian Contract Act, 1872","Contracts and their enforcement."],["Negotiable Instruments Act, 1881","Cheques and promissory notes; cheque bounce (Section 138)."],["Limitation Act, 1963","Time limits for filing suits and appeals."],["Consumer Protection Act, 2019","Consumer rights and complaints."],["Right to Information Act, 2005","Access to information from public authorities."],["Protection of Women from Domestic Violence Act, 2005","Protection and relief for women facing domestic violence."],["Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013","Internal Committees and complaints at workplaces."],["Dowry Prohibition Act, 1961","Prohibits giving and taking dowry."],["Legal Services Authorities Act, 1987","Free legal aid and legal services authorities."],["Information Technology Act, 2000","Cyber law and electronic records."],["Digital Personal Data Protection Act, 2023","Protection of digital personal data."]];
var CASES=[["Kesavananda Bharati v. State of Kerala (1973)","Constitutional law","Parliament can amend the Constitution but cannot destroy its basic structure."],["Maneka Gandhi v. Union of India (1978)","Article 21","Any law restricting personal liberty must be fair, just and reasonable."],["Minerva Mills v. Union of India (1980)","Constitutional law","Reaffirmed basic structure; balance between fundamental rights and directive principles."],["Olga Tellis v. Bombay Municipal Corporation (1985)","Article 21","Right to livelihood is part of the right to life."],["Indra Sawhney v. Union of India (1992)","Reservations","Upheld OBC reservation; set a general 50% ceiling."],["Vishaka v. State of Rajasthan (1997)","Workplace","Guidelines against sexual harassment at work, later the 2013 Act."],["D.K. Basu v. State of West Bengal (1997)","Arrest","Guidelines to protect people arrested or detained."],["Shreya Singhal v. Union of India (2015)","Free speech","Struck down Section 66A of the IT Act."],["K.S. Puttaswamy v. Union of India (2017)","Privacy","Right to privacy is a fundamental right."],["Navtej Singh Johar v. Union of India (2018)","Rights","Consensual same-sex conduct between adults is not a crime (Section 377 read down)."]];
var FAQ=[[/right|article 21|fundamental/,"Your fundamental rights are in Part III of the Constitution: equality, freedom (including speech and movement), protection of life and personal liberty (Article 21), freedom of religion and the right to go to court (Article 32). If you are arrested you must be told the reason, can consult a lawyer, and must be produced before a magistrate within 24 hours."],[/fir|police complaint|report.*police/,"An FIR is the first report of a cognisable offence. Go to any police station and give the facts, orally or in writing. Ask for a free copy. Police cannot refuse a cognisable offence; if they do, write to the Superintendent of Police or approach a Magistrate. See Citizens > FIR guidance."],[/bail|arrest/,"Bail means release while a case continues. For bailable offences it is a right. For non-bailable offences the court decides. Anticipatory bail is sought before arrest. If the police do not file the chargesheet in time (60 or 90 days, depending on the offence) the accused may get default bail. See Citizens > Bail information."],[/consumer|refund|defective|e-?commerce/,"Under the Consumer Protection Act, 2019 you can complain about defective goods or poor service. Call 1915 (National Consumer Helpline) or file online at e-Daakhil. The complaint must usually be filed within 2 years. See Citizens > Consumer complaints."],[/women|domestic|dowry|harass|posh/,"Key laws: the Domestic Violence Act 2005, the POSH Act 2013 (workplace), the Dowry Prohibition Act 1961 and the criminal law on cruelty and sexual offences. Emergency: 112. Women helpline: 181. See Citizens > Women protection laws."],[/rti|right to information/,"Under the RTI Act, 2005 you can ask a government office for information. Write to its Public Information Officer, pay the fee (Rs 10 for central bodies) and expect a reply within 30 days. You can use the Templates page to draft it."],[/legal aid|free lawyer|nalsa|dlsa|cannot afford|can't afford/,"Free legal aid is available to eligible persons (such as women, children, SC/ST, persons in custody and people below an income limit). Contact the District Legal Services Authority at your district court or call NALSA helpline 15100."],[/cheque|bounce/,"A bounced cheque can be an offence under Section 138 of the Negotiable Instruments Act. Send a legal notice within 30 days of the bank memo; the drawer then has 15 days to pay."],[/cyber|online fraud|upi|scam/,"For online financial fraud call 1930 quickly and report at cybercrime.gov.in. Keep screenshots and transaction details."],[/rent|tenant|landlord/,"Tenancy is mainly governed by your state rent law and your rent agreement. Keep a written agreement and receipts."]];

var INFO={rights:["Legal rights",'<p>Part III of the Constitution gives fundamental rights: equality (Articles 14-18), freedoms (19-22), protection against exploitation (23-24), freedom of religion (25-28), cultural and educational rights (29-30) and the right to constitutional remedies (Article 32).</p><ul><li><b>Article 21:</b> right to life and personal liberty.</li><li><b>If arrested (Article 22):</b> know the grounds, consult a lawyer of your choice, and be produced before a magistrate within 24 hours.</li><li><b>Free legal aid:</b> Article 39A and the Legal Services Authorities Act, 1987.</li></ul>'+VER],

fir:["FIR guidance",'<ol><li>Go to any police station. For a cognisable offence the police must register the FIR.</li><li>Give the facts, orally or in writing. Make sure it is read back, then sign it.</li><li>Ask for a <b>free copy</b>.</li><li>If it happened elsewhere, a <b>Zero FIR</b> can be registered at any station and transferred.</li><li>If refused, send the complaint in writing to the Superintendent of Police or approach a Magistrate.</li></ol><p>Emergency: <b>112</b>. Online fraud: <b>1930</b>. Under the BNSS, 2023 electronic complaints are allowed and must be signed within three days.</p><button class="btn s" data-go="tmpl:complaint">Draft a police complaint</button>'+VER],
bail:["Bail information",'<ul><li><b>Bailable offence:</b> bail is a right.</li><li><b>Non-bailable offence:</b> the court decides based on the case.</li><li><b>Anticipatory bail:</b> sought before arrest (earlier Section 438 CrPC; now under the BNSS).</li><li><b>Default bail:</b> if the investigation is not completed in time (60 or 90 days depending on the offence).</li></ul><p>A court may ask for a bail bond with sureties and conditions. Speak to an advocate or the legal aid authority.</p>'+VER],
cons:["Consumer complaints",'<ol><li>Complain first to the seller or company and keep proof.</li><li>Call the National Consumer Helpline <b>1915</b>.</li><li>File online at e-Daakhil or at the Consumer Commission.</li></ol><p>District Commission: up to Rs 50 lakh. State: Rs 50 lakh to 2 crore. National: above Rs 2 crore. Time limit: usually 2 years. No fee up to Rs 5 lakh.</p><ul>'+lk([LINKS[6],LINKS[7]])+'</ul>'+VER],
women:["Women protection laws",'<ul><li><b>Domestic Violence Act, 2005:</b> protection, residence and monetary relief.</li><li><b>POSH Act, 2013:</b> Internal Committee at workplaces with 10 or more employees; complaint generally within 3 months.</li><li><b>Dowry Prohibition Act, 1961.</b></li><li><b>Criminal law (BNS, 2023):</b> cruelty by husband or relatives, sexual offences and stalking.</li></ul><p>Emergency <b>112</b> · Women helpline <b>181</b> · Cyber fraud <b>1930</b></p><ul>'+lk([LINKS[10]])+'</ul>'+VER],

intern:["Internships",'<div class="card"><span class="tag api">Live listings need future integration</span><p>No fake listings are shown.</p></div><ul><li>Prepare a one-page CV and a short email.</li><li>Write to advocates, chambers and law firms in your city.</li><li>Ask your law school placement cell and the District Legal Services Authority (legal aid clinics).</li><li>Verify the advocate on the State Bar Council list.</li></ul>'],

function avHTML(){return '<div style="text-align:center"><div style="width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid var(--fg);margin:0 auto 12px;padding:'+(avatar?0:12)+'px">'+(avatar?avImg():DEF)+'</div><button class="btn o" id="cam" style="margin-bottom:6px">Take photo</button><button class="btn o" id="gal" style="margin-bottom:6px">Choose photo</button>'+(avatar?'<button class="link" id="rm">Remove photo</button>':'')+'<input type="file" id="f1" accept="image/*" capture="user" hidden><input type="file" id="f2" accept="image/*" hidden></div><br>'}
function bindAv(){function again(){$("pm").style.display="none";$("pbtn").onclick()}
function pick(f){if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=240;var s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);avatar=c.toDataURL("image/jpeg",.85);try{localStorage.setItem("lia_av",avatar)}catch(e){}setAv();again()};im.src=rd.result};rd.readAsDataURL(f)}
$("cam").onclick=function(){$("f1").click()};$("gal").onclick=function(){$("f2").click()};
$("f1").onchange=function(){pick(this.files[0])};$("f2").onchange=function(){pick(this.files[0])};
if($("rm"))$("rm").onclick=function(){avatar=null;try{localStorage.removeItem("lia_av")}catch(e){}setAv();again()}}

function setLang(l){lang=l;ls("lia_l",l);$("lg1").value=l;$("lg2").value=l;document.documentElement.lang=l;document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});if(user)go(cur)}
LANGS.forEach(function(l){["lg1","lg2"].forEach(function(i){var o=document.createElement("option");o.value=l[0];o.textContent=l[1];$(i).appendChild(o)})});
$("lg1").onchange=$("lg2").onchange=function(){setLang(this.value)};
$("tabs").onclick=function(e){var r=e.target.getAttribute("data-role");if(!r)return;role=r;[].forEach.call($("tabs").children,function(b){b.className=b===e.target?"on":""});$("pf").style.display=r==="pro"?"":"none"};
$("as").onclick=function(){mode=mode==="signup"?"login":"signup";var s=mode==="signup";$("nmw").style.display=s?"":"none";$("ab").textContent=s?"Create free account":"Log in";$("at").textContent=s?"Already have an account?":"New here?";$("as").textContent=s?"Log in":"Create account"};
$("ab").onclick=async function(){var em=$("ae").value.trim(),pw=$("ap").value,nm=$("an").value.trim(),M=$("amsg");M.textContent="";if(!em||!pw){M.textContent="Enter email and password.";return}if(mode==="signup"&&!nm){M.textContent="Enter your name.";return}if(pw.length<6){M.textContent="Password must be at least 6 characters.";return}
var cat=role==="pro"?$("ac").value:role==="stu"?"Student":"Citizen";if(!LIVE){enter({type:role,name:nm||em.split("@")[0],cat:cat});return}
var r;if(mode==="signup"){r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm,user_type:role,mobile:$("am").value.trim(),category:cat}}});if(!r.error&&!r.data.session){M.textContent="Account created. Confirm using the link sent to your email, then log in.";return}}else r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error){M.textContent=r.error.message;return}load(r.data.session)};
$("mb").onclick=function(){open(true)};$("ov").onclick=function(){open(false)};
$("pbtn").onclick=function(){var p=$("pm");if(p.style.display==="block"){p.style.display="none";return}var rl={cit:"Citizen",pro:"Legal professional",stu:"Law student"};p.innerHTML=avHTML()+'<b>'+esc(user.name)+'</b><div class=mut>'+rl[user.type]+'</div><br><button class="btn o" id="lo">'+t("logout")+'</button>';p.style.display="block";bindAv();$("lo").onclick=function(){if(LIVE)sb.auth.signOut();user=null;avatar=null;ls("lia_av",null);chatLog=[];p.style.display="none";$("app").style.display="none";$("auth").style.display="block"}};
document.body.addEventListener("click",function(e){var g=e.target.closest&&e.target.closest("[data-go]");if(g){e.preventDefault();go(g.getAttribute("data-go"))}});
if(!LIVE)$("demoN").style.display="block";
setLang(ls("lia_l")||"en");
if(LIVE)sb.auth.getSession().then(function(r){if(r.data.session)load(r.data.session)});
</script>
