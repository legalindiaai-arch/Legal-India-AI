<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal India AI</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--line:#ddd;--soft:#f5f4f0;--gold:#9c7a2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#15140f;--gold:#d4ae5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#15140f;--gold:#d4ae5a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px}h2{font-size:23px}h3{font-size:16px}a{color:var(--fg)}
button,input,select,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;width:100%}.btn.o{background:transparent;color:var(--fg)}.btn.s{width:auto;display:inline-block;margin:4px 6px 4px 0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0 12px}
input[type=checkbox],input[type=radio]{width:auto;margin:3px 8px 0 0}label{font-size:13px;color:var(--mut)}label.opt{display:flex;color:var(--fg);font-size:14px;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}.link{text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ic{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:16px;position:relative}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-weight:700;min-width:0;white-space:nowrap}
.lgi{border-radius:50%;background:#fff;object-fit:contain}.brand .lgi{width:34px;height:34px}
.seg{order:2;position:relative;display:flex;border:1px solid var(--gold);border-radius:999px;padding:2px}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);background:var(--fg);border-radius:999px;transition:transform .25s}
.seg button{position:relative;z-index:1;flex:1;background:none;border:0;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;transition:color .25s}.seg button.on{color:var(--bg)}
#bell,#pbtn{order:3}#bc{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;border-radius:10px;font-size:10px;padding:0 5px}
#pbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 14px 3px 3px;background:none;cursor:pointer;max-width:230px;text-align:left}
.pav{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);flex:none;display:flex}.pav svg{padding:6px}.pav img{width:100%;height:100%;object-fit:cover}
.pt{display:flex;flex-direction:column;min-width:0;line-height:1.25}.pt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.seg{order:4;width:100%}#pbtn{max-width:165px}}
#drawer{position:fixed;inset:0 auto 0 0;width:285px;max-width:84%;background:var(--bg);border-right:1px solid var(--gold);transform:translateX(-100%);transition:.2s;z-index:20;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}#drawer.open{transform:none}
#ov{position:fixed;inset:0;background:#0006;display:none;z-index:15}#ov.open{display:block}
#drawer a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14.5px}#drawer a:hover,#drawer a.on{background:var(--soft)}#drawer a.on{border-left:3px solid var(--gold)}#drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#pm{position:fixed;right:12px;top:calc(62px + env(safe-area-inset-top,0px));background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:8px;width:230px;display:none;z-index:30}
#pm a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer}#pm a:hover{background:var(--soft)}
main{flex:1;min-height:0;position:relative}.pg{height:100%;overflow-y:auto;padding:16px;max-width:900px;margin:auto}
.chatpg{display:flex;flex-direction:column;height:100%;max-width:800px;margin:auto}.thr{flex:1;overflow-y:auto;padding:14px 14px 4px}
.hero{max-width:640px;margin:4vh auto 0;text-align:center}.hero h1{font-size:30px}.hero .sub{color:var(--gold);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.chips button{border:1px solid var(--gold);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.m{white-space:pre-wrap;margin-bottom:14px}.m.u{margin-left:auto;background:var(--soft);border:1px solid var(--line);padding:10px 14px;border-radius:16px;width:fit-content;max-width:85%}.m small{display:block;color:var(--mut);margin-top:6px;font-size:11.5px}.m img{max-width:200px;border-radius:8px;display:block;margin-top:6px}
#atts{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px}.at{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.cw{margin:6px 12px 8px;display:flex;gap:6px;border:1px solid var(--fg);border-radius:999px;padding:5px;align-items:center}
.cw input{border:0;margin:0;padding:8px 4px;outline:0;min-width:0}.cw button{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:16px;flex:none}.cw #sd{background:var(--fg);color:var(--bg)}
#bn{display:flex;border-top:1px solid var(--line)}#bn button{flex:1;background:none;border:0;padding:7px 2px;font-size:11px;cursor:pointer;color:var(--mut)}#bn button span{display:block;font-size:18px}#bn button.on{color:var(--gold);font-weight:700}
.disc{font-size:11px;color:var(--mut);padding:3px 12px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.feat{cursor:pointer}.feat:hover{border-color:var(--gold)}.card p{margin:4px 0;font-size:14.5px}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:1px 10px;font-size:11px;margin-right:6px}.tag.w{border-style:dashed}
.stat{font-size:26px;font-family:Georgia,serif}
.md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.mc{background:var(--bg);border:1px solid var(--gold);border-radius:14px;padding:20px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
pre{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;font-family:inherit}details{border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600}ul,ol{padding-left:20px}li{margin:3px 0}
.row{display:flex;gap:8px}.row input{margin:0}.row .btn{width:auto;padding:0 18px}
#fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:#fff;padding:0;cursor:pointer;z-index:12;display:none;box-shadow:0 4px 14px #0004}#fab img{width:100%;height:100%;border-radius:50%}#fab i{position:absolute;right:-4px;top:-4px;background:var(--gold);color:#000;font:700 10px system-ui;border-radius:10px;padding:1px 5px}
#aip{position:fixed;right:14px;bottom:calc(144px + env(safe-area-inset-bottom,0px));width:370px;max-width:calc(100vw - 28px);height:min(560px,calc(100dvh - 230px));background:var(--bg);border:1px solid var(--gold);border-radius:16px;z-index:12;display:none;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px #0005}
.aih{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-family:Georgia,serif}.aih button{background:none;border:0;cursor:pointer;font-size:16px;padding:4px 8px}
#aipb{flex:1;min-height:0}#aipb .hero{margin-top:0}#aipb .hero h1{font-size:19px}#aipb .hero .lgi{width:52px!important;height:52px!important}
</style>
</head>

  <button class="ic" id="mb" aria-label="Menu">☰</button>

var FAQ=[[/right|article 21|fundamental/,"Your fundamental rights are in Part III of the Constitution: equality, freedom (including speech and movement), protection of life and personal liberty (Article 21), freedom of religion and the right to go to court (Article 32). If you are arrested you must be told the reason, can consult a lawyer, and must be produced before a magistrate within 24 hours."],[/fir|police complaint|report.*police/,"An FIR is the first report of a cognisable offence. Go to any police station and give the facts, orally or in writing. Ask for a free copy. Police cannot refuse a cognisable offence; if they do, write to the Superintendent of Police or approach a Magistrate. See Citizens > FIR guidance."],[/bail|arrest/,"Bail means release while a case continues. For bailable offences it is a right. For non-bailable offences the court decides. Anticipatory bail is sought before arrest. If the police do not file the chargesheet in time (60 or 90 days, depending on the offence) the accused may get default bail. See Citizens > Bail information."],[/consumer|refund|defective|e-?commerce/,"Under the Consumer Protection Act, 2019 you can complain about defective goods or poor service. Call 1915 (National Consumer Helpline) or file online at e-Daakhil. The complaint must usually be filed within 2 years. See Citizens > Consumer complaints."],[/women|domestic|dowry|harass|posh/,"Key laws: the Domestic Violence Act 2005, the POSH Act 2013 (workplace), the Dowry Prohibition Act 1961 and the criminal law on cruelty and sexual offences. Emergency: 112. Women helpline: 181. See Citizens > Women protection laws."],[/rti|right to information/,"Under the RTI Act, 2005 you can ask a government office for information. Write to its Public Information Officer, pay the fee (Rs 10 for central bodies) and expect a reply within 30 days. You can use the Templates page to draft it."],[/legal aid|free lawyer|nalsa|dlsa|cannot afford|can't afford/,"Free legal aid is available to eligible persons (such as women, children, SC/ST, persons in custody and people below an income limit). Contact the District Legal Services Authority at your district court or call NALSA helpline 15100."],[/cheque|bounce/,"A bounced cheque can be an offence under Section 138 of the Negotiable Instruments Act. Send a legal notice within 30 days of the bank memo; the drawer then has 15 days to pay."],[/cyber|online fraud|upi|scam/,"For online financial fraud call 1930 quickly and report at cybercrime.gov.in. Keep screenshots and transaction details."],[/rent|tenant|landlord/,"Tenancy is mainly governed by your state rent law and your rent agreement. Keep a written agreement and receipts."]];
var LEG={terms:["Terms &amp; Conditions","<p>By using Legal India AI you agree to these terms.</p><p><b>1. Information only.</b> Content, templates and AI replies are general legal information, not legal advice. No advocate-client relationship is created.</p><p><b>2. Accuracy.</b> Information may be incomplete or outdated. Verify with official sources.</p><p><b>3. Your details.</b> Give accurate details. Citizen mode is currently free.</p><p><b>3A. Paid modes.</b> Professional and Student modes are currently free and need your Bar Council enrolment ID or college details. Paid plans may be introduced later with prior notice.</p><p><b>4. Use.</b> Do not misuse the service or attempt to break its security.</p><p><b>5. Liability.</b> To the extent permitted by law, we are not liable for loss from reliance on the service.</p><p><b>6. Law.</b> Governed by the laws of India. <i>Template text: have a lawyer review before launch.</i></p>"],privacy:["Privacy Policy","<p><b>We collect:</b> your name, mobile number, Gmail and optional profile photo; for Professional or Student mode, your Bar Council enrolment ID or your college name and roll number, and your payment reference and proof of payment; and, if you use them, your chat history, saved items, client and case records and uploaded documents.</p><p><b>Verification:</b> your Gmail is verified with a one-time code. Mobile numbers are not verified yet.</p><p><b>Security:</b> data is stored in Supabase with row-level security so each user can access only their own records. Uploaded documents go to a private storage bucket.</p><p><b>Chats:</b> signed-in conversations are saved to your account so you can see your history. Avoid sharing confidential details you do not need to share.</p><p><b>Sharing:</b> we do not sell personal data. Service providers (hosting and login) process it only to run the service, or when the law requires.</p><p><b>Your rights:</b> you may ask to access, correct or delete your data under the Digital Personal Data Protection Act, 2023. <i>Template text: have a lawyer review before launch.</i></p>"],grievance:["Grievance Redressal","<p>For any complaint about the service, content or your data, write to our Grievance Officer.</p><div class=card><b>Grievance Officer:</b> [Name to be added]<br><b>Email:</b> [Email to be added]<br><b>Address:</b> [Address to be added]</div><p>We aim to acknowledge complaints within 48 hours and resolve them within 15 days. <i>Add real details before launch.</i></p>"]};

var INFO={rights:'<p>Part III of the Constitution gives fundamental rights: equality (Arts 14-18), freedoms (19-22), against exploitation (23-24), religion (25-28), cultural and educational rights (29-30) and constitutional remedies (Art 32).</p><ul><li><b>Article 21:</b> life and personal liberty.</li><li><b>If arrested (Article 22):</b> know the grounds, consult a lawyer, be produced before a magistrate within 24 hours.</li><li><b>Free legal aid:</b> Article 39A and the Legal Services Authorities Act, 1987.</li></ul><h3>Sources</h3>'+lk(["ld","ic"]),

var a;if(AI_FN&&useDB())a=await callAI("chat",chat.slice(-10).map(function(m){return{role:m.r==="u"?"user":"assistant",content:m.t||"(attachment)"}}));else{a="I do not have a built-in answer for that yet. Please check the official sources (indiacode.nic.in, sci.gov.in) or contact your District Legal Services Authority (NALSA helpline 15100). Real AI answers need setup.";for(var j=0;j<FAQ.length;j++)if(FAQ[j][0].test((x||"").toLowerCase())){a=FAQ[j][1];break}}
if(A.length)a+="\n\nI received your attachment(s). Reading files, images or audio needs the AI service, which is not configured yet.";
chat.push({r:"b",t:a});renderChat();saveChat()}
async function saveChat(){var d={title:(chat[0]&&chat[0].t||"Chat").slice(0,60),msgs:chat.map(function(m){return{r:m.r,t:m.t}})};if(cid)await updRec("chat",cid,d);else cid=await addRec("chat",d)}
async function history(){var h=await recs("chat");$("mcard").innerHTML='<h2>Conversation history</h2>'+(h.length?h.map(function(c){return '<div class="card feat" data-ch="'+c.id+'">'+esc(c.title)+'</div>'}).join(""):'<p class="mut">No saved conversations yet.</p>')+'<button class="btn o" id="hc">Close</button>';showMd(true);$("hc").onclick=function(){showMd(false)};[].forEach.call($("mcard").querySelectorAll("[data-ch]"),function(x){x.onclick=function(){var c=h.filter(function(y){return String(y.id)===x.dataset.ch})[0];chat=c.msgs.map(function(m){return{r:m.r,t:m.t}});cid=c.id;showMd(false);renderChat()}})}
var chatHost=null,aiOpen=false;function fabUpdate(){var show=mode!=="cit"&&active(mode)&&page!=="chat";$("fab").style.display=show?"block":"none";if(!show&&aiOpen)aiClose();if(show&&aiOpen)$("aip").style.display="flex"}function aiOpenW(){aiOpen=true;chatHost=$("aipb");$("aip").style.display="flex";renderChat()}function aiClose(){aiOpen=false;chatHost=null;$("aip").style.display="none"}
function logos(){document.querySelectorAll("img[data-logo]").forEach(function(i){i.src=LOGO})}
function authModal(m){m=m||"reg";var lg=m==="login";$("mcard").innerHTML='<h2>'+(lg?"Log in":"Register to continue")+'</h2><p class="mut">'+(LIVE?"We email a one-time code to verify your Gmail.":"Demo mode: details are not verified.")+'</p>'+(lg?'':'<label>Full name</label><input id="rn" autocomplete="name"><label>Indian mobile number</label><input id="rm" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">')+'<label>Gmail address</label><input id="re" type="email" autocomplete="email">'+(lg?'':'<label>Profile photo (optional)</label><input id="rp" type="file" accept="image/*"><label class="opt"><input type="checkbox" id="rc"><span>I agree to the <button class="link" data-leg="terms">Terms</button> and <button class="link" data-leg="privacy">Privacy Policy</button>.</span></label>')+'<div id="rerr" class="mut" style="margin-bottom:8px"></div><button class="btn" id="rb">'+(LIVE?"Send code":"Continue")+'</button><p class="mut" style="text-align:center"><button class="link" id="rs">'+(lg?"New here? Register":"Already registered? Log in")+'</button> · <button class="link" id="rx">Cancel</button></p>';showMd(true);open(false);
$("rx").onclick=function(){if(pending&&$("q"))$("q").value=pending.x;pending=null;showMd(false)};$("rs").onclick=function(){authModal(lg?"reg":"login")};
$("rb").onclick=async function(){var E=$("rerr"),em=$("re").value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){E.textContent="Enter a valid Gmail address.";return}tmp=null;if(!lg){var n=$("rn").value.trim(),mo=$("rm").value.trim();if(n.length<2){E.textContent="Enter your name.";return}if(!/^[6-9]\d{9}$/.test(mo)){E.textContent="Enter a valid 10-digit Indian mobile number.";return}if(!$("rc").checked){E.textContent="Please accept the Terms and Privacy Policy.";return}tmp={name:n,mobile:mo,email:em};var f=$("rp").files[0];if(f)await new Promise(function(ok){img2data(f,160,function(d){tmp.photo=d;ok()})})}
if(!LIVE){prof=tmp||{name:em.split("@")[0],mobile:"",email:em};await saveProf();done();return}
var r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:!lg,data:tmp?{name:tmp.name,mobile:tmp.mobile}:undefined}});if(r.error){E.textContent=r.error.message;return}otp(em)}}
function otp(em){$("mcard").innerHTML='<h2>Enter the code</h2><p class="mut">We sent a code to '+esc(em)+'. Check your inbox and spam folder.</p><input id="oc" inputmode="numeric" maxlength="8" placeholder="Code"><div id="rerr" class="mut" style="margin-bottom:8px"></div><button class="btn" id="ob">Verify</button>';$("ob").onclick=async function(){var r=await sb.auth.verifyOtp({email:em,token:$("oc").value.trim(),type:"email"});if(r.error){$("rerr").textContent=r.error.message;return}U=r.data.user;if(tmp){prof={name:tmp.name,mobile:tmp.mobile,email:em,photo:tmp.photo};var e=await saveProf();if(e){$("rerr").textContent=e.message;return}}else await loadProf();if(!prof){authModal("reg");$("rerr").textContent="Please complete your registration details.";return}done()}}
function done(){showMd(false);renderProfile();setMode(mode,true);if(pending){var p=pending;pending=null;if(mode==="cit"&&!aiOpen)go("chat");ask(p.x,p.A)}}
function setMode(m,keep){mode=m;ls("lia_mode",m);var i=["cit","pro","stu"].indexOf(m);$("th").style.transform="translateX("+i*100+"%)";[].forEach.call($("seg").querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-m")===m)});if(useDB()&&prof)saveProf();go(keep?page:(m==="cit"?"chat":"home"))}
function setLang(l){lang=l;ls("lia_l",l);document.documentElement.lang=l;[].forEach.call($("seg").querySelectorAll("button"),function(b){b.textContent=t(b.getAttribute("data-m"))});$("disc").textContent=t("disc");go(page)}

function signOut(){if(LIVE)sb.auth.signOut();U=null;prof=null;mem={};ls("lia_mem",null);ls("lia_prof",null);chat=[];cid=null;renderProfile();go("home")}

$("mb").onclick=function(){open(true)};$("ov").onclick=function(){open(false)};$("bell").onclick=function(){go("notifs")};

$("fpick").onchange=function(){[].forEach.call(this.files,function(f){addAtt(f)});this.value=""};$("ipick").onchange=function(){if(this.files[0])addAtt(this.files[0],"image");this.value=""};
$("avpick").onchange=function(){var f=this.files[0];this.value="";if(!f)return;img2data(f,160,function(d){if(!prof)prof={name:"Guest",mobile:"",email:"",photo:d};prof.photo=d;saveProf();renderProfile();go(page)})};

if(LIVE)prof=null;else refreshMem();
