<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal India AI</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#666;--line:#ddd;--soft:#f3f3f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#aaa;--line:#333;--soft:#161616;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
h2{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px}
button,input,select{font:inherit;color:var(--fg)}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600;width:100%}.btn.o{background:transparent;color:var(--fg)}.btn.s{width:auto;display:inline-block}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:5px 0 12px}
input[type=checkbox]{width:auto;margin:3px 8px 0 0}label{font-size:13px;color:var(--mut)}label.opt{display:flex;color:var(--fg);font-size:13px;margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}.link{text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ic{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:16px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-weight:700;min-width:0;white-space:nowrap}
.lgi{border-radius:50%;background:#fff;object-fit:contain}.brand .lgi{width:34px;height:34px}
.seg{order:2;position:relative;display:flex;border:1px solid var(--fg);border-radius:999px;padding:2px}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);background:var(--fg);border-radius:999px;transition:transform .25s}
.seg button{position:relative;z-index:1;flex:1;background:none;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:color .25s}.seg button.on{color:var(--bg)}
#pbtn{order:3;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 14px 3px 3px;background:none;cursor:pointer;max-width:230px;text-align:left}
.pav{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--fg);flex:none;display:flex}.pav svg{padding:6px}
.pt{display:flex;flex-direction:column;min-width:0;line-height:1.25}.pt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.seg{order:4;width:100%}#pbtn{max-width:175px}}
#drawer{position:fixed;inset:0 auto 0 0;width:270px;max-width:82%;background:var(--bg);border-right:1px solid var(--fg);transform:translateX(-100%);transition:.2s;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;overflow-y:auto}#drawer.open{transform:none}
#ov{position:fixed;inset:0;background:#0006;display:none;z-index:15}#ov.open{display:block}
#drawer a{display:block;padding:10px;border-radius:8px;cursor:pointer}#drawer a:hover{background:var(--soft)}#drawer hr{border:0;border-top:1px solid var(--line);margin:10px 0}
#pm{position:fixed;right:12px;top:calc(62px + env(safe-area-inset-top,0px));background:var(--bg);border:1px solid var(--fg);border-radius:12px;padding:14px;width:230px;display:none;z-index:30}
main{flex:1;overflow-y:auto;padding:16px}
.hero{max-width:640px;margin:6vh auto 0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.chips button{border:1px solid var(--fg);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px}
.thread{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:14px}.m{white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--soft);border:1px solid var(--line);padding:10px 14px;border-radius:16px;max-width:85%}
.m.b small{display:block;color:var(--mut);margin-top:6px;font-size:11.5px}
#comp{padding:8px 12px}.cw{max-width:760px;margin:auto;display:flex;gap:8px;border:1px solid var(--fg);border-radius:999px;padding:5px 5px 5px 16px;align-items:center}
.cw input{border:0;margin:0;padding:8px 0;outline:0}.cw button{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;font-size:16px;flex:none}
.disc{font-size:11.5px;color:var(--mut);padding:4px 12px 8px;text-align:center}
.md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.mc{background:var(--bg);border:1px solid var(--fg);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.big{text-align:center;max-width:480px;margin:40px auto}
</style>
</head>
<body>
<div id="app">
 <header>
  <button class="ic" id="mb" aria-label="Menu">☰</button>
  <div class="brand"><img class="lgi" data-logo alt="">Legal India AI</div>
  <div class="seg" id="seg"><i class="th" id="th"></i><button data-m="cit"></button><button data-m="pro"></button><button data-m="stu"></button></div>
  <button id="pbtn" aria-label="Profile"></button>
 </header>
 <div id="pm"></div><div id="ov"></div><nav id="drawer"></nav>
 <main id="main"></main>
 <div id="comp"><div class="cw"><input id="q" aria-label="Question"><button id="sd" aria-label="Send">➤</button></div></div>
 <div class="disc" id="disc"></div>
</div>
<div class="md" id="md"><div class="mc" id="mcard"></div></div>

var LANGS=[["en","English"],["hi","हिन्दी"],["kn","ಕನ್ನಡ"],["ta","தமிழ்"]],CHIPS=["How to file an FIR?","Consumer complaint","Free legal aid","What is RTI?","Women helplines"];
var FAQ=[[/right|article 21|fundamental/,"Your fundamental rights are in Part III of the Constitution: equality, freedom (including speech and movement), protection of life and personal liberty (Article 21), freedom of religion and the right to go to court (Article 32). If you are arrested you must be told the reason, can consult a lawyer, and must be produced before a magistrate within 24 hours."],[/fir|police complaint|report.*police/,"An FIR is the first report of a cognisable offence. Go to any police station and give the facts, orally or in writing. Ask for a free copy. Police cannot refuse a cognisable offence; if they do, write to the Superintendent of Police or approach a Magistrate. See Citizens > FIR guidance."],[/bail|arrest/,"Bail means release while a case continues. For bailable offences it is a right. For non-bailable offences the court decides. Anticipatory bail is sought before arrest. If the police do not file the chargesheet in time (60 or 90 days, depending on the offence) the accused may get default bail. See Citizens > Bail information."],[/consumer|refund|defective|e-?commerce/,"Under the Consumer Protection Act, 2019 you can complain about defective goods or poor service. Call 1915 (National Consumer Helpline) or file online at e-Daakhil. The complaint must usually be filed within 2 years. See Citizens > Consumer complaints."],[/women|domestic|dowry|harass|posh/,"Key laws: the Domestic Violence Act 2005, the POSH Act 2013 (workplace), the Dowry Prohibition Act 1961 and the criminal law on cruelty and sexual offences. Emergency: 112. Women helpline: 181. See Citizens > Women protection laws."],[/rti|right to information/,"Under the RTI Act, 2005 you can ask a government office for information. Write to its Public Information Officer, pay the fee (Rs 10 for central bodies) and expect a reply within 30 days. You can use the Templates page to draft it."],[/legal aid|free lawyer|nalsa|dlsa|cannot afford|can't afford/,"Free legal aid is available to eligible persons (such as women, children, SC/ST, persons in custody and people below an income limit). Contact the District Legal Services Authority at your district court or call NALSA helpline 15100."],[/cheque|bounce/,"A bounced cheque can be an offence under Section 138 of the Negotiable Instruments Act. Send a legal notice within 30 days of the bank memo; the drawer then has 15 days to pay."],[/cyber|online fraud|upi|scam/,"For online financial fraud call 1930 quickly and report at cybercrime.gov.in. Keep screenshots and transaction details."],[/rent|tenant|landlord/,"Tenancy is mainly governed by your state rent law and your rent agreement. Keep a written agreement and receipts."]];
var LEG={terms:["Terms &amp; Conditions","<p>By using Legal India AI you agree to these terms.</p><p><b>1. Information only.</b> Content, templates and AI replies are general legal information, not legal advice. No advocate-client relationship is created.</p><p><b>2. Accuracy.</b> Information may be incomplete or outdated. Verify with official sources.</p><p><b>3. Your details.</b> Give accurate details. Citizen mode is currently free.</p><p><b>4. Use.</b> Do not misuse the service or attempt to break its security.</p><p><b>5. Liability.</b> To the extent permitted by law, we are not liable for loss from reliance on the service.</p><p><b>6. Law.</b> Governed by the laws of India. <i>Template text: have a lawyer review before launch.</i></p>"],privacy:["Privacy Policy","<p><b>We collect:</b> your name, mobile number and email when you start using the assistant. We have not verified these details (no OTP yet).</p><p><b>Chats:</b> the built-in assistant does not store your questions. Avoid entering confidential case details.</p><p><b>Sharing:</b> we do not sell personal data. Service providers (hosting and login) process it only to run the service, or when the law requires.</p><p><b>Your rights:</b> you may ask to access, correct or delete your data under the Digital Personal Data Protection Act, 2023. <i>Template text: have a lawyer review before launch.</i></p>"],grievance:["Grievance Redressal","<p>For any complaint about the service, content or your data, write to our Grievance Officer.</p><div class=card><b>Grievance Officer:</b> [Name to be added]<br><b>Email:</b> [Email to be added]<br><b>Address:</b> [Address to be added]</div><p>We aim to acknowledge complaints within 48 hours and resolve them within 15 days. <i>Add real details before launch.</i></p>"]};
var avatar=null;try{avatar=localStorage.getItem("lia_av")}catch(e){}
var DEF='<svg viewBox="0 0 24 24" fill="currentColor" style="width:100%;height:100%"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
function avImg(){return '<img src="'+avatar+'" alt="Profile" style="width:100%;height:100%;object-fit:cover;display:block">'}
function setAv(){$("pbtn").innerHTML=avatar?avImg():DEF}
function avHTML(){return '<div style="text-align:center"><div style="width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid var(--fg);margin:0 auto 12px;padding:'+(avatar?0:12)+'px">'+(avatar?avImg():DEF)+'</div><button class="btn o" id="cam" style="margin-bottom:6px">Take photo</button><button class="btn o" id="gal" style="margin-bottom:6px">Choose photo</button>'+(avatar?'<button class="link" id="rm">Remove photo</button>':'')+'<input type="file" id="f1" accept="image/*" capture="user" hidden><input type="file" id="f2" accept="image/*" hidden></div><br>'}
function bindAv(){function again(){$("pm").style.display="none";$("pbtn").onclick()}
function pick(f){if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=240;var s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);avatar=c.toDataURL("image/jpeg",.85);try{localStorage.setItem("lia_av",avatar)}catch(e){}setAv();again()};im.src=rd.result};rd.readAsDataURL(f)}
$("cam").onclick=function(){$("f1").click()};$("gal").onclick=function(){$("f2").click()};
$("f1").onchange=function(){pick(this.files[0])};$("f2").onchange=function(){pick(this.files[0])};
if($("rm"))$("rm").onclick=function(){avatar=null;try{localStorage.removeItem("lia_av")}catch(e){}setAv();again()}}


function renderProfile(){$("pbtn").innerHTML='<span class="pav">'+(avatar?avImg():DEF)+'</span><span class="pt"><b>'+esc(reg?reg.name:"Guest")+'</b><small>'+(reg?esc(reg.mobile)+" · "+esc(reg.email):"Not signed in")+'</small></span>'}
setAv=renderProfile;
function answer(x){x=x.toLowerCase();for(var i=0;i<FAQ.length;i++)if(FAQ[i][0].test(x))return FAQ[i][1];return "I do not have a built-in answer for that yet. Please check the official sources (indiacode.nic.in, sci.gov.in) or contact your District Legal Services Authority (NALSA helpline 15100). Real AI answers need API integration, which is not connected yet."}
function logos(){document.querySelectorAll("img[data-logo]").forEach(function(i){i.src=LOGO})}
function renderChat(){var m=$("main"),h="";if(!chat.length)h='<div class="hero"><img class="lgi" data-logo style="width:88px;height:88px" alt=""><h2>'+(reg?'Namaste, '+esc(reg.name):'Namaste')+'</h2><p>'+t("greet")+'</p><div class="chips">'+CHIPS.map(function(c){return '<button data-chip="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div><p class="mut">Built-in legal guide with simple explanations. Not live AI: real AI answers need API integration (not connected yet). Answers are in English for now.</p></div>';
else h='<div class="thread">'+chat.map(function(c){return '<div class="m '+c[0]+'">'+esc(c[1])+(c[0]==="b"?'<small>Verify on official sources. Not legal advice.</small>':'')+'</div>'}).join("")+'</div>';m.innerHTML=h;logos();m.scrollTop=m.scrollHeight}
function renderSoon(){$("main").innerHTML='<div class="card big"><h2>'+t(mode)+'</h2><p>'+t("soon")+'</p><button class="btn s" id="bk">'+t("cit")+'</button></div>';$("bk").onclick=function(){setMode("cit")}}
function setMode(m){mode=m;var i=["cit","pro","stu"].indexOf(m);$("th").style.transform="translateX("+i*100+"%)";[].forEach.call($("seg").querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-m")===m)});$("mb").style.display=m==="cit"?"":"none";$("comp").style.display=m==="cit"?"":"none";open(false);$("pm").style.display="none";if(m==="cit")renderChat();else renderSoon()}
function labels(){[].forEach.call($("seg").querySelectorAll("button"),function(b){b.textContent=t(b.getAttribute("data-m"))});$("q").placeholder=t("ask");$("disc").textContent=t("disc");drawer()}
function setLang(l){lang=l;ls("lia_l",l);document.documentElement.lang=l;labels();setMode(mode)}
function drawer(){$("drawer").innerHTML='<div style="font-weight:700;font-family:Georgia,serif;font-size:18px;margin-bottom:8px">Legal India AI</div><a data-act="new">'+t("newchat")+'</a><hr><label>Language</label><select id="dl">'+LANGS.map(function(l){return '<option value="'+l[0]+'"'+(l[0]===lang?' selected':'')+'>'+l[1]+'</option>'}).join("")+'</select><hr><a data-leg="terms">Terms &amp; Conditions</a><a data-leg="privacy">Privacy Policy</a><a data-leg="grievance">Grievance Redressal</a><hr><p class="mut">More menu items coming soon.</p>';$("dl").onchange=function(){setLang(this.value)}}
function open(o){$("drawer").classList.toggle("open",o);$("ov").classList.toggle("open",o)}
function showMd(b){$("md").style.display=b===false?"none":"flex"}
function regForm(){$("mcard").innerHTML='<h2>Continue to get your answer</h2><p class="mut">Citizen mode is free. Please share your details.</p><label>Full name</label><input id="rn" autocomplete="name"><label>Mobile number</label><input id="rm" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel"><label>Gmail</label><input id="re" type="email" placeholder="you@gmail.com" autocomplete="email"><label class="opt"><input type="checkbox" id="rc"><span>I agree to the <button class="link" data-leg="terms">Terms</button> and <button class="link" data-leg="privacy">Privacy Policy</button> and allow Legal India AI to store these details.</span></label><div id="rerr" class="mut" style="margin-bottom:8px"></div><button class="btn" id="rb">Continue</button><button class="btn o" id="rx" style="margin-top:8px">Cancel</button>';showMd(true);
$("rx").onclick=function(){if(pending)$("q").value=pending;pending=null;showMd(false)};
$("rb").onclick=function(){var n=$("rn").value.trim(),mo=$("rm").value.trim(),em=$("re").value.trim(),E=$("rerr");if(n.length<2){E.textContent="Please enter your name.";return}if(!/^[6-9]\d{9}$/.test(mo)){E.textContent="Enter a valid 10-digit Indian mobile number.";return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){E.textContent="Enter a valid Gmail address.";return}if(!$("rc").checked){E.textContent="Please accept the Terms and Privacy Policy.";return}
reg={name:n,mobile:mo,email:em};ls("lia_u",JSON.stringify(reg));if(LIVE)sb.from("citizens").insert({name:n,mobile:mo,email:em,consent:true}).then(function(){});showMd(false);renderProfile();var p=pending;pending=null;if(p)ask(p);else renderChat()}}
function showLeg(k){$("mcard").innerHTML='<h2>'+LEG[k][0]+'</h2>'+LEG[k][1]+'<button class="btn" id="lb">'+(pending&&!reg?"Back":"Close")+'</button>';showMd(true);open(false);$("lb").onclick=function(){if(pending&&!reg)regForm();else showMd(false)}}
function ask(x){x=(x||$("q").value).trim();if(!x)return;$("q").value="";if(!reg){pending=x;regForm();return}chat.push(["u",x]);renderChat();setTimeout(function(){chat.push(["b",answer(x)]);renderChat()},450)}
$("sd").onclick=function(){ask()};$("q").onkeydown=function(e){if(e.key==="Enter")ask()};
$("seg").onclick=function(e){var m=e.target.getAttribute("data-m");if(m)setMode(m)};
$("mb").onclick=function(){open(true)};$("ov").onclick=function(){open(false)};
$("pbtn").onclick=function(){var p=$("pm");if(p.style.display==="block"){p.style.display="none";return}p.innerHTML=avHTML()+(reg?'<b>'+esc(reg.name)+'</b><div class="mut">'+esc(reg.mobile)+'<br>'+esc(reg.email)+'</div><br><button class="btn o" id="lo">Sign out</button>':'<b>Guest</b><div class="mut">Ask a question to sign in.</div>');p.style.display="block";bindAv();if(reg)$("lo").onclick=function(){reg=null;ls("lia_u",null);avatar=null;ls("lia_av",null);chat=[];p.style.display="none";renderProfile();renderChat()}};
document.body.addEventListener("click",function(e){var g=e.target.closest("[data-leg]");if(g){showLeg(g.getAttribute("data-leg"));return}g=e.target.closest("[data-chip]");if(g){ask(g.getAttribute("data-chip"));return}g=e.target.closest("[data-act]");if(g){chat=[];renderChat();open(false)}});

renderProfile();setLang(ls("lia_l")||"en");
